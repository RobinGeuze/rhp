version: 2
updates:
  # Rust crate dependencies (grouped so the mago-* suite bumps together).
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      mago:
        patterns:
          - "mago-*"

  # GitHub Actions used by the workflows above.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
