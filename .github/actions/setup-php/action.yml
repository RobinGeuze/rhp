name: Set up php for rhp's differential tests
description: >
  Install php and php-cgi via setup-php, plus `php` / `php-cgi` shims that
  force-load shared extensions whenever the harness runs them with `-n`.

# rhp's harness runs php with `-n` (no ini) for deterministic output.
# Debian/Ubuntu php ships most extensions as shared modules enabled via ini,
# which `-n` drops. Homebrew php compiles them all in statically, so `-n` keeps
# them there. The shim closes that gap: when `-n` is present, it loads every
# wanted extension from the command line (which `-n` does not affect). It
# injects an extension only if its .so exists and php hasn't compiled it in.
# Either mistake would print a startup warning to stdout and corrupt every
# comparison. Non-`-n` invocations pass through untouched.
#
# php-cgi (the reference for CGI .phpt tests and `rhp-difftest app`) gets the
# same shim, next to the `php` one: the harness finds php-cgi beside php.

inputs:
  php-version:
    description: php version for setup-php (e.g. '8.5')
    required: true

runs:
  using: composite
  steps:
    - uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: >-
          bcmath, bz2, calendar, ctype, curl, dom, exif, fileinfo, gettext, gmp, iconv,
          intl, mbstring, pcntl, phar, posix, shmop, simplexml, sockets, sodium,
          sysvmsg, sysvsem, sysvshm, tokenizer, xml, xmlreader, xmlwriter, zip
        coverage: none

    - name: Make sure php-cgi is installed
      shell: bash
      run: |
        if ! command -v php-cgi >/dev/null 2>&1; then
          v="$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')"
          echo "setup-php installed no php-cgi; installing php$v-cgi"
          sudo apt-get install -y --no-install-recommends "php$v-cgi"
        fi
        command -v php-cgi
        php-cgi -v | head -1

    - name: Install php and php-cgi shims that force-load extensions under -n
      shell: bash
      run: |
        EXTDIR="$(php-config --extension-dir)"
        builtin="$(php -n -m | tr 'A-Z' 'a-z')"
        inject="-d extension_dir=$EXTDIR"
        for e in bcmath bz2 calendar ctype curl dom exif fileinfo gettext gmp iconv intl \
                 mbstring openssl pcntl phar posix session shmop simplexml sockets sodium \
                 sysvmsg sysvsem sysvshm tokenizer xml xmlreader xmlwriter zip; do
          if ! grep -qx "$e" <<<"$builtin" && [ -f "$EXTDIR/$e.so" ]; then
            inject="$inject -d extension=$e"
          fi
        done
        echo "shims inject under -n: $inject"
        SHIM="$HOME/php-shim"
        mkdir -p "$SHIM"
        for bin in php php-cgi; do
          REAL="$(command -v "$bin")"
          cat > "$SHIM/$bin" <<EOF
        #!/usr/bin/env bash
        for a in "\$@"; do
          if [ "\$a" = "-n" ]; then
            exec "$REAL" $inject "\$@"
          fi
        done
        exec "$REAL" "\$@"
        EOF
          chmod +x "$SHIM/$bin"
        done
        echo "$SHIM" >> "$GITHUB_PATH"

    - name: Confirm extensions load under -n with clean stdout
      shell: bash
      run: |
        echo "default: $(php --version | head -1)"
        echo "modules under -n: $(php -n -m | tr '\n' ' ')"
        out="$(php -n -r 'echo "ok";')"
        if [ "$out" != "ok" ]; then
          echo "php -n prints startup noise on stdout:"; echo "$out"; exit 1
        fi
        php -n -r 'foreach (["bcmath","ctype","gmp","mbstring","phar"] as $e) { if (!extension_loaded($e)) { fwrite(STDERR, "missing $e\n"); exit(1); } } echo "required extensions loaded\n";'
        # php-cgi: a CGI request must answer with headers and a clean body.
        dir="$(mktemp -d)"
        echo '<?php echo implode(",", array_map("strtolower", get_loaded_extensions()));' > "$dir/t.php"
        out="$(env -i PATH="$PATH" REDIRECT_STATUS=1 REQUEST_METHOD=GET SCRIPT_FILENAME="$dir/t.php" php-cgi -n -d opcache.enable=0)"
        rm -rf "$dir"
        echo "php-cgi -n: $(command -v php-cgi)"; echo "$out"
        body="$(printf '%s' "$out" | sed '1,/^\r\?$/d')"
        for e in mbstring ctype tokenizer dom; do
          if ! tr ',' '\n' <<<"$body" | grep -qx "$e"; then
            echo "php-cgi -n is missing $e (or printed startup noise)"; exit 1
          fi
        done
