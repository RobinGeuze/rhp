# Console battery for bin/console (`python3 tests/apps/apps.py console`;
# format in console.py). Each command starts from a var/ warmed by
# `php -n bin/console cache:warmup`, so rhp runs on php's compiled container.

shared = ["vendor"]
clear = ["var"]
prepare = ["bin/console cache:warmup"]

# cache:clear rebuilds the container: its build time, and the build id
# hashed from it, are the time of the run.
[[mask]]
name = "build-time"
builtin = "now-epoch"
in = ["files"]

[[mask]]
name = "build-id"
pattern = "'container.build_id' => '[0-9a-f]{8}'"
replace = "'container.build_id' => '<ID>'"
in = ["files"]

# `about` prints the current time.
[[mask]]
name = "iso-now"
pattern = '\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d[+-]\d\d:\d\d'
replace = "<NOW>"
in = ["stdout"]

[[command]]
id = "version"
args = "--version"

[[command]]
id = "list"
args = "list"

[[command]]
id = "about"
args = "about"

[[command]]
id = "help-cache-clear"
args = "help cache:clear"

[[command]]
id = "debug-router"
args = "debug:router"

[[command]]
id = "debug-router-hello"
args = "debug:router hello"

[[command]]
id = "router-match-hellox"
args = "router:match /hello/x"

[[command]]
id = "debug-container"
args = "debug:container"

[[command]]
