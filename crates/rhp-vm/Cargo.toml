[package]
name = "rhp-vm"
edition.workspace = true
version.workspace = true
# Our code: MIT OR Apache-2.0; code translated from php-src (main/output.c) keeps
# the PHP License 3.01 (THIRD-PARTY-NOTICES, section 4).
license = "(MIT OR Apache-2.0) AND PHP-3.01"
publish.workspace = true

[features]
default = []

[dependencies]
rhp-values = { path = "../rhp-values" }
rhp-bytecode = { path = "../rhp-bytecode" }
rhp-builtins = { path = "../rhp-builtins" }
indexmap = { workspace = true }
rustc-hash = { workspace = true }
smallvec = { workspace = true }
# Fiber stack switching (fibers.rs), as php uses boost.context.
corosensei = "=0.3.4"

[dev-dependencies]
# tests/golden.rs runs tests/golden/vm through the request layer.
rhp-sapi = { path = "../rhp-sapi" }
