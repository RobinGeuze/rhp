[package]
name = "phrust-builtins"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
phrust-values = { path = "../phrust-values" }
phrust-semantics = { path = "../phrust-semantics" }
pcre2-sys = "0.2.10"
libc = "0.2"

# `hash` extension algorithms. Pure-Rust (RustCrypto et al.) where a faithful
# 1:1 implementation exists; the oddballs with no crate (snefru, haval, php's
# 4-pass tiger, the murmur/fnv/crc/adler variants) are hand-rolled in `hash/`.
digest = "0.10"
md2 = "0.10"
md4 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
ripemd = "0.1"
whirlpool = "0.10"
tiger = "0.2"
gost94 = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh32", "xxh64", "xxh3"] }
