[package]
name = "rhp-difftest"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "rhp_difftest"
path = "src/lib.rs"

[[bin]]
name = "rhp-difftest"
path = "src/main.rs"

[dependencies]
rhp-compiler = { path = "../../crates/rhp-compiler" }
rhp-sapi = { path = "../../crates/rhp-sapi" }
rhp-values = { path = "../../crates/rhp-values" }
# EXPECTF and app masks use rhp-builtins' PCRE2, so the binary links one copy.
rhp-builtins = { path = "../../crates/rhp-builtins" }
libc = "0.2"
toml = "0.9"
aes = "0.8"
cbc = "0.1"
hmac = "0.13"
sha2 = "0.11"
base64 = "0.22"
flate2 = { version = "1.1", default-features = false, features = ["zlib"] }
