name: Install rhp's native build dependencies
description: >
  Installs the C libraries rhp links (docs/design/libraries.md), at the
  versions the reference php links. Every job that builds rhp uses this. To
  add a library, add its -dev package here and its row in
  crates/rhp-builtins/build/native.rs.

inputs:
  php:
    description: >
      The php whose library versions rhp must link. Run this action after that
      php is installed. Empty: `php` if one is on PATH, else the distro's
      versions.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install native build dependencies
      id: apt
      shell: bash
      env:
        PHP_BIN: ${{ inputs.php }}
      run: |
        # PCRE2 (libpcre2-8.a) and libxml2 (libxml2.a), linked statically.
        sudo apt-get update -q
        sudo apt-get install -y --no-install-recommends \
          pkg-config \
          libpcre2-dev \
          libxml2-dev
        php="${PHP_BIN:-$(command -v php || true)}"
        build=""
        # compare <name> <pkg-config module> <php code printing the version php loads>
        compare() {
          local have want
          have="$(pkg-config --modversion "$2")"
          want="$have"
          if [ -n "$php" ]; then want="$("$php" -n -r "$3")"; fi
          echo "$1: the distro has $have; ${php:-no php} links $want"
          if [ "$want" != "$have" ]; then build="$build $1-$want"; fi
        }
        # shellcheck disable=SC2016 # PHP code, not shell
        compare pcre2 libpcre2-8 'echo strtok(PCRE_VERSION, " ");'
        # shellcheck disable=SC2016
        compare libxml2 libxml-2.0 '$v = (int) LIBXML_LOADED_VERSION; echo intdiv($v, 10000), ".", intdiv($v, 100) % 100, ".", $v % 100;'
        if [ -n "$php" ]; then
          # rhp's LIBXML_DOTTED_VERSION is its headers' and LIBXML_LOADED_VERSION
          # its library's: one release. php can differ only if it loads a
          # libxml2 other than the one it was compiled against.
          # shellcheck disable=SC2016
          "$php" -n -r 'echo "libxml2: php compiled against ", LIBXML_DOTTED_VERSION, ", loads ", LIBXML_LOADED_VERSION, "\n";'
        fi
        echo "build=${build# }" >> "$GITHUB_OUTPUT"
        echo "os=$(. /etc/os-release && echo "$ID-$VERSION_ID")" >> "$GITHUB_OUTPUT"

    # php links a release the distro has no -dev package for (setup-php's php
    # on a new Ubuntu ships its own newer libpcre2-8.so). Build that release
    # from its checksummed tarball, static only, and point pkg-config at it.
    - name: Restore source builds (${{ steps.apt.outputs.build }})
      if: steps.apt.outputs.build != ''
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/rhp-native
        key: native-${{ steps.apt.outputs.build }}-${{ steps.apt.outputs.os }}-${{ runner.arch }}-${{ hashFiles('.github/actions/native-deps/**') }}
    - name: Build the releases php links (${{ steps.apt.outputs.build }})
      if: steps.apt.outputs.build != '' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        BUILD: ${{ steps.apt.outputs.build }}
      run: |
        for lib in $BUILD; do
          "$GITHUB_ACTION_PATH/build-from-source.sh" "${lib%-*}" "${lib##*-}"
        done
    - name: Use the source builds
      if: steps.apt.outputs.build != ''
      shell: bash
      env:
        BUILD: ${{ steps.apt.outputs.build }}
      run: |
        path="${PKG_CONFIG_PATH:-}"
        for lib in $BUILD; do
          path="$HOME/.cache/rhp-native/$lib/lib/pkgconfig${path:+:$path}"
        done
        echo "PKG_CONFIG_PATH=$path" >> "$GITHUB_ENV"
        PKG_CONFIG_PATH="$path" pkg-config --modversion libpcre2-8 libxml-2.0
