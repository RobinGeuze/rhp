[package]
name = "rhp-csrc"
description = "php-src's own C, and frozen C libraries php links, vendored and compiled statically"
edition.workspace = true
version.workspace = true
publish.workspace = true
# Our Rust, shim and glue: MIT OR Apache-2.0 (shim/ follows php-src's header
# API: Zend-2.0, PHP-3.01). Vendored (see NOTICE): php-src (PHP-3.01),
# libavifinfo (BSD-2-Clause), crypt_freesec (BSD-3-Clause), crypt_blowfish
# and crypt_sha256/512 (public domain), timelib (MIT), argon2 (CC0-1.0 OR Apache-2.0; Thomas Pornin's code
# in src/encoding.c is CC0-1.0 only).
license = "(MIT OR Apache-2.0) AND PHP-3.01 AND Zend-2.0 AND BSD-2-Clause AND BSD-3-Clause AND LicenseRef-Public-Domain AND MIT AND (CC0-1.0 OR Apache-2.0) AND CC0-1.0"
links = "rhp_csrc"
build = "build.rs"

[features]
# One feature per vendored library.
default = ["crypt", "argon2", "timelib", "avifinfo"]
crypt = []
argon2 = []
timelib = []
avifinfo = []

[dependencies]
# memory_limit accounting for the shim's allocator (src/lib.rs).
rhp-values = { path = "../rhp-values" }

[build-dependencies]
cc = "1.9"
