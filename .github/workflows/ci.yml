name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. force-push to a PR branch).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Formatting: cheap, fail fast.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Lints, warnings treated as errors.
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/native-deps
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # The suite with NO `php` on PATH: the VM is validated byte-for-byte against
  # the committed `.out` golden fixtures (captured from the reference php,
  # crates/rhp-builtins/src/version.rs), and every
  # live-php test guards on `php_available()` and skips. Proves the suite is
  # green for a contributor without php installed. (ubuntu-latest ships its own
  # php, so we remove it first.)
  test:
    name: test (no php)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Remove the runner's pre-installed php
        run: |
          sudo update-alternatives --remove-all php >/dev/null 2>&1 || true
          sudo rm -f /usr/bin/php* /usr/local/bin/php* || true
          if command -v php >/dev/null 2>&1; then
            echo "php still on PATH at $(command -v php)"; exit 1
          fi
          echo "no php on PATH — live-php tests will skip"
      - uses: ./.github/actions/native-deps
      - run: cargo test --workspace --all-targets --no-fail-fast

  # Full suite against real php 8.5, the version rhp targets (another minor
  # version is no reference). This includes the extension differential
  # sweeps: crates/rhp-difftest/tests run the hash, bcmath, ctype, gmp,
  # mbstring and password sweeps with the binary's default seed and corpus,
  # plus more seeds.
  php:
    name: php 8.5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # php + a shim so `php -n` keeps the shared extensions (see the action).
      - uses: ./.github/actions/setup-php
        with:
          php-version: '8.5'
      # After setup-php, so apt resolves the -dev packages against the
      # libraries php itself installed.
      - uses: ./.github/actions/native-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Full workspace suite against php 8.5
        env:
          RHP_PHP: php
        # The CGI fixtures run the real php-cgi, not the shim: the shim's
        # extra `-d extension=…` arguments change php-cgi's option parsing
        # (argument numbers, `-q`, script detection), and bash reorders the
        # environment that getallheaders() reports. They need no shared ext.
        run: |
          export PHP_CGI="$(command -v php-cgi8.5)"
          echo "PHP_CGI=$PHP_CGI"
          # TEMP diagnostics for the PCRE2 parity check.
          php -n -r 'echo "php: PCRE_VERSION=", PCRE_VERSION, " MINOR=", PCRE_VERSION_MINOR, "\n";'
          dpkg -l 'libpcre2*' | tail -n +6 || true
          ldconfig -p | grep pcre2-8 || true
          ls -la /usr/lib/x86_64-linux-gnu/libpcre2-8.so* /usr/lib/x86_64-linux-gnu/glibc-hwcaps/*/libpcre2-8.so* 2>/dev/null || true
          cargo test --workspace --all-targets --no-fail-fast

  # php-src .phpt ratchet: every test in tests/phpt/known-passing.txt must
  # still match php. The list is generated by `rhp-difftest phpt --write-known`
  # against the php-src commit pinned in tests/phpt/php-src.ref; the nightly
  # workflow reports newly passing tests to add.
  phpt:
    name: phpt ratchet (php 8.5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read pinned php-src commit
        id: ref
        run: echo "sha=$(grep -v '^#' tests/phpt/php-src.ref | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: php/php-src
          ref: ${{ steps.ref.outputs.sha }}
          path: php-src
          persist-credentials: false
          # Every test tree known-passing.txt may list (non-cone, as the
          # nightly does): tests/ includes tests/basic; sapi/cgi/tests,
          # ext/session/tests and a few others hold CGI tests
          # (--GET--/--POST--/--CGI--/...), run under php-cgi; tests also
          # include helpers from other trees' tests/ directories.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Zend/tests/
            /tests/
            /ext/*/tests/
            /sapi/*/tests/
      - uses: ./.github/actions/setup-php
        with:
          php-version: '8.5'
      # After setup-php, so apt resolves the -dev packages against the
      # libraries php itself installed.
      - uses: ./.github/actions/native-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p rhp-cli -p rhp-difftest
      - name: Known-passing php-src tests still match
        run: >-
          target/release/rhp-difftest phpt --php-src php-src
          --php-cgi "$(command -v php-cgi)"
          --check-known tests/phpt/known-passing.txt

  # Pinned framework fixture apps (tests/apps/apps.toml): the matrix is read
  # from the manifest, so adding an app version needs no workflow change.
  apps-matrix:
    name: fixture apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.m.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
      - id: m
        run: echo "apps=$(python3 tests/apps/apps.py matrix)" >> "$GITHUB_OUTPUT"

  # Per app: install vendor/ from the lockfile (no composer scripts; cached on
  # the lockfile hash), smoke-test its routes under php, then the compile-only
  # ratchet: `rhp-difftest lint --check-known` fails only on a file rhp newly
  # refuses; listed files that now compile are a notice, never a failure.
  # Last, the request diff ratchet (`rhp-difftest app --check-known`).
  apps-lint:
    name: app ${{ matrix.app }}
    needs: apps-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.apps-matrix.outputs.apps) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-php
        with:
          php-version: '8.5'
      # After setup-php, so apt resolves the -dev packages against the
      # libraries php itself installed.
      - uses: ./.github/actions/native-deps
      - uses: actions/cache@v4
        with:
          path: tests/apps/${{ matrix.app }}/vendor
          key: apps-vendor-${{ matrix.app }}-${{ hashFiles(format('tests/apps/{0}/composer.lock', matrix.app)) }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install and set up the app
        run: python3 tests/apps/apps.py setup ${{ matrix.app }}
      - name: Smoke-test the app under php
        run: python3 tests/apps/apps.py smoke ${{ matrix.app }}
      - run: cargo build --release -p rhp-difftest -p rhp-cli
      - name: No new compile refusals
        run: python3 tests/apps/apps.py lint ${{ matrix.app }}
      # The request corpus through php-cgi and `rhp --cgi`: fails only when a
      # request in known-passing-requests.txt stops answering like php-cgi.
      - name: Known requests still answer like php-cgi
        run: python3 tests/apps/apps.py diff ${{ matrix.app }}
