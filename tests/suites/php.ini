; The php.ini of every suite run, under php and rhp alike (suites.py sets
; PHPRC to it, so PHPUnit's own subprocesses read it too). Without it php
; reads the machine's php.ini (Homebrew's: variables_order=GPCS,
; short_open_tag off; setup-php's) while rhp, which has no built-in ini
; path, runs on php's defaults: the two would not run the same tests.
; Everything not set here is php's built-in default.
memory_limit = -1
