[package]
name = "rhp-difftest"
edition.workspace = true
version.workspace = true
# Our code: MIT OR Apache-2.0; code translated from php-src (run-tests.php's $ini_overwrites) keeps
# the PHP License 3.01 (THIRD-PARTY-NOTICES, section 4).
license = "(MIT OR Apache-2.0) AND PHP-3.01"
publish.workspace = true

[lib]
name = "rhp_difftest"
path = "src/lib.rs"

[[bin]]
name = "rhp-difftest"
path = "src/main.rs"

[dependencies]
rhp-bytecode = { path = "../../crates/rhp-bytecode" }
rhp-compiler = { path = "../../crates/rhp-compiler" }
rhp-sapi = { path = "../../crates/rhp-sapi" }
rhp-values = { path = "../../crates/rhp-values" }
# EXPECTF and app masks use rhp-builtins' PCRE2, so the binary links one copy.
rhp-builtins = { path = "../../crates/rhp-builtins" }
libc = "0.2"
toml = "1.1"
aes = "0.9"
cbc = "0.2"
hmac = "0.13"
sha2 = "0.11"
base64 = "0.22"
flate2 = { version = "1.1", default-features = false, features = ["zlib"] }
