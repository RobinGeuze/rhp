[package]
name = "rhp-builtins"
edition.workspace = true
version.workspace = true
# Our code: MIT OR Apache-2.0. Translated or derived code keeps its licence
# (THIRD-PARTY-NOTICES, by section): php-src (4: PHP-3.01, Zend-2.0),
# md5crypt (8: Beerware), the Bison skeleton (10), charset maps (11), glob and
# Mt19937 (21, 24: BSD-3-Clause), libc++ sort (22), strnatcmp (23: Zlib), the
# email regexes (25). The C libraries it links are not part of its source.
license = "(MIT OR Apache-2.0) AND PHP-3.01 AND Zend-2.0 AND Beerware AND GPL-3.0-or-later WITH Bison-exception-2.2 AND LicenseRef-Unicode-Mapping-Files AND BSD-3-Clause AND (NCSA OR MIT) AND Zlib AND LicenseRef-Rushton-Email-Regex"
publish.workspace = true

[features]
default = ["mbstring-libmbfl"]
# The mbstring extension, on php-src's libmbfl (LGPL-2.1, in the
# rhp-mbfl-sys crate). Without it rhp-builtins has no mbstring extension and
# contains no LGPL code; rhp-vm, rhp-sapi and rhp-difftest enable it (they use
# the default features).
mbstring-libmbfl = ["dep:rhp-mbfl-sys"]

[dependencies]
rhp-values = { path = "../rhp-values" }
# The stub signatures (rhp_bytecode::signatures).
rhp-bytecode = { path = "../rhp-bytecode" }
libc = "0.2"
indexmap = { workspace = true }
rustc-hash = { workspace = true }
# Substring search (explode, …), as php_memnstr.
memchr = "2"
# No -sys crate for PCRE2: build.rs links the system libpcre2-8 (see
# docs/design/libraries.md) and src/ext/pcre/sys.rs declares what rhp calls.
# pcre2-sys would silently build its bundled copy instead.

# `hash` extension algorithms. Pure-Rust (RustCrypto et al.) where a faithful
# 1:1 implementation exists; crc32b and adler32 use zlib (libz-sys). The
# oddballs with no crate (snefru, haval, tiger (php's 4-pass form, so 3-pass
# shares it), crc32 (bzip2), crc32c, fnv, joaat, murmur) are hand-rolled in
# `hash/`.
digest = "0.11"
md2 = "0.11"
md4 = "0.11"
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
sha3 = "0.12"
ripemd = "0.2"
whirlpool = "0.11"
gost94 = "0.11"
xxhash-rust = { version = "0.8", features = ["xxh32", "xxh64", "xxh3"] }

# bcmath: arbitrary-precision integers (the decimal/scale semantics are
# PHP-specific and hand-rolled in ext/bcmath). gmp links libgmp.
num-bigint = "0.5"
num-traits = "0.2"
num-integer = "0.1"

# crypt() and password_*: php-src's crypt C and the argon2 reference C php
# links, compiled from source and linked statically.
rhp-csrc = { path = "../rhp-csrc", default-features = false, features = ["crypt", "argon2", "timelib", "avifinfo", "fileinfo", "lexbor", "calendar"] }
rhp-mbfl-sys = { path = "../rhp-mbfl-sys", optional = true }

# zlib + phar per-file compression + ZipArchive: raw DEFLATE / zlib / gzip,
# CRC-32. Backed by the system C zlib (build.rs refuses libz-sys's bundled
# copy) rather than miniz_oxide so compressed bytes are identical to php's.
flate2 = { version = "1.1", default-features = false, features = ["zlib"] }
# Direct zlib calls where php's exact deflateInit2 parameters matter (memLevel 9,
# sync flushes): gzencode & co., the compress.zlib:// wrapper, ZipArchive; also
# crc32() / hash('crc32b') / adler32 and ZipArchive entry CRCs.
libz-sys = "1.1"

# bz2 extension, the compress.bzip2:// wrapper, phar and ZipArchive bzip2
# entries: C libbz2 1.0.8 (frozen, php's version) built from bzip2-sys's
# bundled source and linked statically.
# Pinned: bzip2 0.6 defaults to the pure-Rust libbz2-rs instead of C libbz2.
bzip2 = { version = "=0.6.1", default-features = false, features = ["bzip2-sys", "static"] }

# openssl extension, the TLS stream transports (and so https://) and phar's
# OpenSSL signatures: the OpenSSL php links,
# statically (no bindgen, no vendored copy; see .cargo/config.toml and
# build/native.rs). src/ext/openssl/sys.rs declares what openssl-sys lacks.
openssl-sys = "0.9.118"

# CSPRNG for random_bytes/random_int/mt_rand.
getrandom = "0.4"

# dl.rs: reads a shared library's exported symbols to tell a php extension
# module (one exporting get_module) from other libraries without loading it.
object = { version = "0.37", default-features = false, features = ["read_core", "elf", "macho", "std", "unaligned"] }

[build-dependencies]
# Compiles the libxml2, ICU and curl shims against the headers of the
# libraries it links.
cc = "1.9"
