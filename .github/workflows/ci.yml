name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. force-push to a PR branch).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Formatting: cheap, fail fast.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Lints, warnings treated as errors.
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # The suite with NO `php` on PATH: the VM is validated byte-for-byte against
  # the committed `.out` golden fixtures (captured from php 8.5.8), and every
  # live-php test guards on `php_available()` and skips. Proves the suite is
  # green for a contributor without php installed. (ubuntu-latest ships its own
  # php, so we remove it first.)
  test:
    name: test (no php)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Remove the runner's pre-installed php
        run: |
          sudo update-alternatives --remove-all php >/dev/null 2>&1 || true
          sudo rm -f /usr/bin/php* /usr/local/bin/php* || true
          if command -v php >/dev/null 2>&1; then
            echo "php still on PATH at $(command -v php)"; exit 1
          fi
          echo "no php on PATH — live-php tests will skip"
      - run: cargo test --workspace --all-targets

  # Full suite + differential sweeps against real php, one leg per version.
  # Add a version to the matrix list to cover it.
  php:
    name: php ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, ctype, gmp, mbstring, phar
          coverage: none
      # The rhp test harness runs php with `-n` (no ini) for deterministic
      # output. Debian/Ubuntu php ships bcmath/ctype/gmp/mbstring/phar as shared
      # extensions enabled via ini, which `-n` drops — so install a `php` shim
      # that force-loads them from the command line (which `-n` does not affect)
      # whenever `-n` is present, matching a statically-built php (e.g. Homebrew).
      - name: Install php shim that force-loads extensions under -n
        run: |
          REAL="$(command -v php)"
          EXTDIR="$(php-config --extension-dir)"
          SHIM="$HOME/php-shim"
          mkdir -p "$SHIM"
          cat > "$SHIM/php" <<EOF
          #!/usr/bin/env bash
          inject=()
          for a in "\$@"; do
            if [ "\$a" = "-n" ]; then
              inject=(-d extension_dir="$EXTDIR" -d extension=bcmath -d extension=ctype -d extension=gmp -d extension=mbstring -d extension=phar)
              break
            fi
          done
          exec "$REAL" "\${inject[@]}" "\$@"
          EOF
          chmod +x "$SHIM/php"
          echo "$SHIM" >> "$GITHUB_PATH"
      - name: Confirm extensions load under -n
        run: |
          echo "default: $(php --version | head -1)"
          echo "modules under -n: $(php -n -m | tr '\n' ' ')"
          php -n -r 'foreach (["bcmath","ctype","gmp","mbstring","phar"] as $e) { echo $e, "=", (int)extension_loaded($e), " "; } echo "\n";'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Full workspace suite against php ${{ matrix.php }}
        env:
          RHP_PHP: php
        run: cargo test --workspace --all-targets
      - name: Extension differential sweeps
        env:
          RHP_PHP: php
        run: |
          for ext in hash bcmath ctype gmp mbstring password; do
            echo "::group::rhp-difftest $ext"
            cargo run --quiet -p rhp-difftest -- "$ext"
            echo "::endgroup::"
          done
