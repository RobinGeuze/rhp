[package]
name = "rhp-builtins"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rhp-values = { path = "../rhp-values" }
rhp-semantics = { path = "../rhp-semantics" }
pcre2-sys = "0.2.10"
libc = "0.2"

# `hash` extension algorithms. Pure-Rust (RustCrypto et al.) where a faithful
# 1:1 implementation exists; the oddballs with no crate (snefru, haval, php's
# 4-pass tiger, the murmur/fnv/crc/adler variants) are hand-rolled in `hash/`.
digest = "0.10"
md2 = "0.10"
md4 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
ripemd = "0.1"
whirlpool = "0.10"
tiger = "0.2"
gost94 = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh32", "xxh64", "xxh3"] }

# bcmath + gmp: arbitrary-precision integers (the decimal/scale semantics for
# bcmath are PHP-specific and hand-rolled in ext/bcmath).
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"

# password_* : bcrypt + argon2 password hashing (faithful Rust 1:1).
bcrypt = "0.17"
argon2 = "0.5"
password-hash = { version = "0.5", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }

# zlib + phar per-file compression: raw DEFLATE / zlib / gzip (pure-Rust backend).
flate2 = "1.1"

# CSPRNG for random_bytes/random_int/mt_rand.
getrandom = "0.2"
