name: Install rhp's native build dependencies
description: >
  Installs the C libraries rhp links (docs/design/libraries.md), at the
  versions the reference php links. Every job that builds rhp uses this. To
  add a library, add its -dev package here and its row in
  crates/rhp-builtins/build/native.rs.

inputs:
  php:
    description: >
      The php whose library versions rhp must link. Run this action after that
      php is installed. Empty: `php` if one is on PATH, else the distro's
      versions.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install native build dependencies
      id: apt
      shell: bash
      env:
        PHP_BIN: ${{ inputs.php }}
      run: |
        # PCRE2: libpcre2-8.a, linked statically.
        sudo apt-get update -q
        sudo apt-get install -y --no-install-recommends \
          pkg-config \
          libpcre2-dev
        have="$(pkg-config --modversion libpcre2-8)"
        php="${PHP_BIN:-$(command -v php || true)}"
        want="$have"
        if [ -n "$php" ]; then
          # shellcheck disable=SC2016 # PHP code, not shell
          want="$("$php" -n -r 'echo strtok(PCRE_VERSION, " ");')"
        fi
        echo "PCRE2: the distro has $have; ${php:-no php} links $want"
        echo "pcre2=$want" >> "$GITHUB_OUTPUT"
        echo "os=$(. /etc/os-release && echo "$ID-$VERSION_ID")" >> "$GITHUB_OUTPUT"
        if [ "$want" != "$have" ]; then
          echo "pcre2-build=true" >> "$GITHUB_OUTPUT"
        fi

    # php links a PCRE2 the distro has no -dev package for (setup-php's php
    # on a new Ubuntu ships its own newer libpcre2-8.so). Build that release
    # from its checksummed tarball, static only, and point pkg-config at it.
    - name: Restore PCRE2 ${{ steps.apt.outputs.pcre2 }}
      if: steps.apt.outputs.pcre2-build == 'true'
      id: pcre2-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/rhp-native/pcre2-${{ steps.apt.outputs.pcre2 }}
        key: pcre2-${{ steps.apt.outputs.pcre2 }}-${{ steps.apt.outputs.os }}-${{ runner.arch }}-${{ hashFiles('.github/actions/native-deps/**') }}
    - name: Build PCRE2 ${{ steps.apt.outputs.pcre2 }}, the release php links
      if: steps.apt.outputs.pcre2-build == 'true' && steps.pcre2-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        V: ${{ steps.apt.outputs.pcre2 }}
      run: |
        tarball="pcre2-$V.tar.bz2"
        sum="$(awk -v f="$tarball" '$2 == f { print $1 }' "$GITHUB_ACTION_PATH/sha256sums")"
        if [ -z "$sum" ]; then
          echo "::error::php links PCRE2 $V, and .github/actions/native-deps/sha256sums has no checksum for $tarball. Add the release tarball's SHA-256 (Homebrew's pcre2 formula pins it)."
          exit 1
        fi
        tmp="$(mktemp -d)"
        curl -fsSL --retry 3 -o "$tmp/$tarball" \
          "https://github.com/PCRE2Project/pcre2/releases/download/pcre2-$V/$tarball"
        echo "$sum  $tmp/$tarball" | sha256sum -c -
        tar -xjf "$tmp/$tarball" -C "$tmp"
        cd "$tmp/pcre2-$V"
        ./configure --prefix="$HOME/.cache/rhp-native/pcre2-$V" \
          --disable-shared --enable-static --with-pic --enable-jit
        make -j"$(nproc)"
        make install
    - name: Use PCRE2 ${{ steps.apt.outputs.pcre2 }}
      if: steps.apt.outputs.pcre2-build == 'true'
      shell: bash
      env:
        V: ${{ steps.apt.outputs.pcre2 }}
      run: |
        pc="$HOME/.cache/rhp-native/pcre2-$V/lib/pkgconfig"
        echo "PKG_CONFIG_PATH=$pc${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
        echo "PCRE2: $(PKG_CONFIG_PATH="$pc" pkg-config --modversion libpcre2-8) from $pc"
