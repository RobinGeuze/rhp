# Request corpus for `rhp-difftest app laravel-13` (see tests/apps/README.md).
#
# Every request runs through php-cgi and then through rhp --cgi, on this same
# directory, each engine starting from the same pristine state.

# Writable state, restored from the pristine snapshot before each engine.
state = [
    "storage/framework/views",
    "storage/framework/cache",
    "storage/framework/sessions",
    "storage/logs",
    "storage/app/private",
    "bootstrap/cache",
]

# No warm-up: Laravel compiles Blade views lazily, so each engine compiles
# them itself and the compiled views are diffed as @files.
# (bootstrap/cache/{packages,services}.php come from `artisan package:discover`
# at setup; they are SAPI-independent manifests.)
warmup = "none"

# Laravel encrypts its cookies (AES-256-CBC + HMAC-SHA256) with a random IV:
# the harness decrypts them with the fixed APP_KEY from .env, checks the MAC,
# and shows `name=decrypted(<prefix>|<value>)`, the value alpha-renamed.
encrypted_cookies = "laravel"

# Capture group 1 is a random token, alpha-renamed consistently across
# headers, bodies, steps and written files (session file names + contents).
tokens = [
    'name="csrf-token" content="([^"]+)"',
    'name="_token" value="([^"]+)"',
    # session files; a 419 stores a token no response shows
    '"_token":"([A-Za-z0-9]+)"',
]

# `debug`: APP_DEBUG=true (the environment wins over .env), so the throwing
# route prints Laravel's exception page.
[[pass]]
name = "debug"
env = { APP_DEBUG = "true" }

[[request]]
id = "home"
path = "/"
status = 200

[[request]]
id = "hello-world"
path = "/hello/world"
status = 200

[[request]]
id = "api-json"
path = "/api/json?a=1&b[]=x"
status = 200

[[request]]
id = "not-found"
path = "/nope"
status = 404

# No session, no token: the CSRF middleware answers 419.
[[request]]
id = "submit-no-token"
method = "POST"
path = "/submit"
status = 419
body = "x=1"

# A flow: the GET starts a session and sets XSRF-TOKEN; the POSTs replay the
# engine's own cookie jar and send the token back, once the way axios does
# (X-XSRF-TOKEN = the encrypted cookie) and once as a form field (_token =
# the decrypted token).
[[request]]
id = "csrf-get"
flow = "csrf"
path = "/hello/flow"
status = 200

[[request]]
id = "csrf-post-header"
flow = "csrf"
method = "POST"
path = "/submit"
status = 200
headers = ["X-XSRF-TOKEN: {cookie:XSRF-TOKEN}"]
body = "x=1&y=two"

[[request]]
id = "csrf-post-field"
flow = "csrf"
method = "POST"
path = "/submit"
status = 200
body = "_token={cookie-plain:XSRF-TOKEN}&list[]=a&list[]=b"

[[request]]
id = "components"
path = "/components"
status = 200

[[request]]
id = "js"
path = "/js"
status = 200

[[request]]
id = "api-chars"
path = "/api/chars"
status = 200

[[request]]
id = "queue"
path = "/queue"
status = 200

[[request]]
id = "period"
path = "/period"
status = 200

# Rule::enum: GET the form (the session remembers it as the previous URL),
# POST a bad value (302 back, errors and old input flashed), GET it again,
# then POST a good value.
[[request]]
id = "enum-form"
flow = "enum"
path = "/enum"
status = 200

[[request]]
id = "enum-bad"
flow = "enum"
method = "POST"
path = "/enum"
body = "suit=clubs&note=too+long"
status = 302

[[request]]
id = "enum-errors"
flow = "enum"
path = "/enum"
status = 200

[[request]]
id = "enum-ok"
flow = "enum"
method = "POST"
path = "/enum"
body = "suit=hearts"
status = 200

[[request]]
id = "upload"
method = "POST"
path = "/upload"
content_type = "multipart/form-data; boundary=XyZ"
body = "--XyZ\r\nContent-Disposition: form-data; name=\"title\"\r\n\r\nmy é doc\r\n--XyZ\r\nContent-Disposition: form-data; name=\"tags[]\"\r\n\r\na\r\n--XyZ\r\nContent-Disposition: form-data; name=\"tags[]\"\r\n\r\nb\r\n--XyZ\r\nContent-Disposition: form-data; name=\"doc\"; filename=\"a b.txt\"\r\nContent-Type: text/plain\r\n\r\nhello upload\nline2\r\n--XyZ--\r\n"
status = 200

[[request]]
id = "upload-mime"
method = "POST"
path = "/upload-mime"
content_type = "multipart/form-data; boundary=XyZ"
body = "--XyZ\r\nContent-Disposition: form-data; name=\"doc\"; filename=\"p.txt\"\r\nContent-Type: image/png\r\n\r\n<?php echo 1;\n\r\n--XyZ--\r\n"
status = 200

[[request]]
id = "number"
path = "/number"
status = 200

[[request]]
id = "storage"
path = "/storage"
status = 200

[[request]]
id = "boom"
path = "/boom"
status = 500
