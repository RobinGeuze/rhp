name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. force-push to a PR branch).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Formatting: cheap, fail fast.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Lints, warnings treated as errors.
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # The suite with NO `php` on PATH: the VM is validated byte-for-byte against
  # the committed `.out` golden fixtures (captured from php 8.5.8), and every
  # live-php test guards on `php_available()` and skips. Proves the suite is
  # green for a contributor without php installed. (ubuntu-latest ships its own
  # php, so we remove it first.)
  test:
    name: test (no php)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Remove the runner's pre-installed php
        run: |
          sudo update-alternatives --remove-all php >/dev/null 2>&1 || true
          sudo rm -f /usr/bin/php* /usr/local/bin/php* || true
          if command -v php >/dev/null 2>&1; then
            echo "php still on PATH at $(command -v php)"; exit 1
          fi
          echo "no php on PATH — live-php tests will skip"
      - run: cargo test --workspace --all-targets --no-fail-fast

  # Full suite + differential sweeps against real php, one leg per version.
  # Add a version to the matrix list to cover it.
  php:
    name: php ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5', '8.4']
    steps:
      - uses: actions/checkout@v7
      # php + a shim so `php -n` keeps the shared extensions (see the action).
      - uses: ./.github/actions/setup-php
        with:
          php-version: ${{ matrix.php }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Full workspace suite against php ${{ matrix.php }}
        env:
          RHP_PHP: php
        run: cargo test --workspace --all-targets --no-fail-fast
      - name: Extension differential sweeps
        env:
          RHP_PHP: php
        run: |
          for ext in hash bcmath ctype gmp mbstring password; do
            echo "::group::rhp-difftest $ext"
            cargo run --quiet -p rhp-difftest -- "$ext"
            echo "::endgroup::"
          done

  # php-src .phpt ratchet: every test in tests/phpt/known-passing.txt must
  # still match php. The list is generated by `rhp-difftest phpt --write-known`
  # against the php-src commit pinned in tests/phpt/php-src.ref; the nightly
  # workflow reports newly passing tests to add.
  phpt:
    name: phpt ratchet (php 8.5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read pinned php-src commit
        id: ref
        run: echo "sha=$(grep -v '^#' tests/phpt/php-src.ref | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: php/php-src
          ref: ${{ steps.ref.outputs.sha }}
          path: php-src
          persist-credentials: false
          sparse-checkout: |
            Zend/tests
            tests
            ext/standard/tests
      - uses: ./.github/actions/setup-php
        with:
          php-version: '8.5'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p rhp-cli -p rhp-difftest
      - name: Known-passing php-src tests still match
        run: target/release/rhp-difftest phpt --php-src php-src --check-known tests/phpt/known-passing.txt

  # Pinned framework fixture apps (tests/apps/apps.toml): the matrix is read
  # from the manifest, so adding an app version needs no workflow change.
  apps-matrix:
    name: fixture apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.m.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
      - id: m
        run: echo "apps=$(python3 tests/apps/apps.py matrix)" >> "$GITHUB_OUTPUT"

  # Per app: install vendor/ from the lockfile (no composer scripts; cached on
  # the lockfile hash), smoke-test its routes under php, then the compile-only
  # ratchet: `rhp-difftest lint --check-known` fails only on a file rhp newly
  # refuses; listed files that now compile are a notice, never a failure.
  apps-lint:
    name: app ${{ matrix.app }}
    needs: apps-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.apps-matrix.outputs.apps) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-php
        with:
          php-version: '8.5'
      - uses: actions/cache@v4
        with:
          path: tests/apps/${{ matrix.app }}/vendor
          key: apps-vendor-${{ matrix.app }}-${{ hashFiles(format('tests/apps/{0}/composer.lock', matrix.app)) }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install and set up the app
        run: python3 tests/apps/apps.py setup ${{ matrix.app }}
      - name: Smoke-test the app under php
        run: python3 tests/apps/apps.py smoke ${{ matrix.app }}
      - run: cargo build --release -p rhp-difftest
      - name: No new compile refusals
        run: python3 tests/apps/apps.py lint ${{ matrix.app }}
