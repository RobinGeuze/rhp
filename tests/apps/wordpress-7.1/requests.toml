# Request corpus for `rhp-difftest app wordpress-7.1` (see tests/apps/README.md).
#
# Every request runs through php-cgi and then through rhp --cgi, on this same
# directory, each engine starting from the same pristine state. A path that
# names a .php file under the docroot (/wp-login.php) runs that file; any
# other path runs wordpress/index.php (pretty permalinks).

# Writable state, restored from the pristine snapshot before each engine:
# the SQLite database `setup.php` installed and seeded.
state = ["var/database"]

# The first request after setup boots the site: it stores the cron schedule
# (with the time it ran), the default widgets and a few other options. So the
# corpus runs once through php-cgi first and that database is the pristine
# state for both engines, as a deploy that has served a request is (warm once,
# serve many). From then on serving a page only reads it (`@files` lists
# nothing written).
warmup = "corpus"

ini = []

# Capture group 1 is a random token, alpha-renamed consistently. WordPress's
# nonces depend on the time (a new one every 12 hours), so a run that
# crosses a boundary would see php's and rhp's differ.
tokens = ['"nonce":"([0-9a-f]{10})"']

# Values WordPress derives from the clock or from random numbers.
# The user-settings cookie holds the time it was set.
[[mask]]
name = "wp-settings-time"
pattern = 'wp-settings-time-(\d+)=\d+'
replace = "wp-settings-time-$1=<TIME>"
in = ["headers", "body"]

# Auth cookies: `user|expiry|session token|hmac`.
[[mask]]
name = "auth-cookie"
pattern = '(wordpress_(?:sec_|logged_in_)?[0-9a-f]{32}=[^%;]+%7C)\d+%7C[A-Za-z0-9]+%7C[0-9a-f]{64}'
replace = "$1<EXPIRY>%7C<SESSION>%7C<HMAC>"
in = ["headers"]

# wpdb's placeholder escape: `{<sha256 of a random salt>}` around `%`.
[[mask]]
name = "wpdb-placeholder"
pattern = '\{[0-9a-f]{64}\}'
replace = "{PH}"
in = ["body"]

# The clock in wp-admin: user settings, the post lock, the time and format
# previews (options-general.php), Site Health's times, the comment list's
# page timestamp, cron's "overdue by" note.
[[mask]]
name = "user-settings-time"
pattern = '(var userSettings = \{[^}]*"time":")\d+'
replace = "$1<TIME>"

[[mask]]
name = "post-lock"
pattern = '("activePostLock":")\d+'
replace = "$1<TIME>"

[[mask]]
name = "time-previews"
pattern = '((?:Universal|Local) time is <code>|<span class="date-time-text format-i18n">|<span class="example">)[^<]+'
replace = "$1<NOW>"

[[mask]]
name = "site-health-time"
pattern = '((?m)^(?:current|utc-time|server-time): |<th scope="row">Current (?:UTC |Server )?time</th><td>)[^<\n]+'
replace = "$1<NOW>"

[[mask]]
name = "pagegen-timestamp"
pattern = '(name="pagegen_timestamp" value=")[^"]+'
replace = "$1<NOW>"

[[mask]]
name = "cron-overdue"
pattern = '(overdue by )\d+ \w+'
replace = "$1<N>"

# Random values: the embed secret and share-tab ids, antispambot()'s mix of
# entities in mailto links, the suggested password on profile.php, the
# comment moderation hash (it hashes the comment's time).
[[mask]]
name = "embed-secret"
pattern = 'secret=(&quot;|\\"|\\\\&quot;)?[A-Za-z0-9]{10}'
replace = "secret=$1<SECRET>"

[[mask]]
name = "embed-share-id"
pattern = 'wp-embed-share-(tab|description)-(wordpress|html)-(\d+)-\d+'
replace = "wp-embed-share-$1-$2-$3-<RAND>"

[[mask]]
name = "antispambot"
pattern = '(<a href="mailto:)[^"]*(">)[^<]*(</a>)'
replace = "$1<EMAIL>$2<EMAIL>$3"

[[mask]]
name = "data-pw"
pattern = 'data-pw="[^"]*"'
replace = 'data-pw="<PW>"'

[[mask]]
name = "moderation-hash"
pattern = 'moderation-hash=[0-9a-f]+'
replace = "moderation-hash=<HASH>"
in = ["headers"]

# In the database dump: Unix times (cron, transients, edit locks, session
# expiry) and the session tokens a login stores.
[[mask]]
name = "db-epoch"
pattern = '(?<![0-9])1[789]\d{8}(?![0-9])'
replace = "<EPOCH>"
in = ["files"]

[[mask]]
name = "db-session-token"
pattern = 's:64:"[0-9a-f]{64}"'
replace = 's:64:"<SESSION>"'
in = ["files"]

