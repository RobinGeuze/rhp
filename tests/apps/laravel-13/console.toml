# Console battery for artisan (`python3 tests/apps/apps.py console`; format
# in console.py): artisan commands, `tinker --execute` snippets and workload
# scripts (console/*.php, each boots the console kernel and prints sections).
# No database exists, so the commands that need one fail under both engines.

shared = ["vendor"]

# Migration file names carry the time of the run.
[[mask]]
name = "migration-time"
pattern = '\d{4}_\d\d_\d\d_\d{6}'
replace = "<MIGRATION_TIME>"
in = ["stdout", "stderr", "files", "paths"]

# Unnamed routes get a random name when cached.
[[mask]]
name = "generated-route"
pattern = 'generated::[A-Za-z0-9]{16}'
replace = "generated::<RANDOM>"
in = ["files"]

# Durations (and the dots padding them to the width) in TwoColumnDetail lines.
[[mask]]
name = "duration"
pattern = ' \.+ [\d.]+ ?(ms|s) '
replace = " <DOTS> <DURATION> "
in = ["stdout"]

# Times of the run: log lines, cache expiry stamps.
[[mask]]
name = "now-datetime"
builtin = "now-datetime"
in = ["stdout", "stderr", "files"]

[[mask]]
name = "now-epoch"
builtin = "now-epoch"
in = ["stdout", "stderr", "files"]

# Random session ids (file names) and CSRF tokens.
[[mask]]
name = "session-file"
pattern = 'sessions/[A-Za-z0-9]{40}$'
replace = "sessions/<ID>"
in = ["paths"]

[[mask]]
name = "csrf-token"
pattern = '"_token":"[A-Za-z0-9]{40}"'
replace = '"_token":"<TOKEN>"'
in = ["files"]

# A random quote from Illuminate\Foundation\Inspiring.
[[mask]]
name = "inspiring-quote"
pattern = '“ .* ”\n  — .*'
replace = "<QUOTE>"
in = ["stdout"]
commands = ["inspire"]

[[mask]]
name = "inspiring-comment"
pattern = '<!-- .* -->'
replace = "<!-- <QUOTE> -->"
in = ["files"]
commands = ["make-component", "make-view"]

[[mask]]
name = "random-key"
pattern = 'base64:[A-Za-z0-9+/]{43}='
replace = "base64:<KEY>"
in = ["stdout"]
commands = ["key-generate-show"]

