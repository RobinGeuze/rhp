[package]
name = "phrust-builtins"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Feasibility prototype: run PHP extension C source compiled against a macro shim.
zendshim = ["dep:phrust-zendshim"]

[dependencies]
phrust-values = { path = "../phrust-values" }
phrust-semantics = { path = "../phrust-semantics" }
phrust-zendshim = { path = "../phrust-zendshim", optional = true }
pcre2-sys = "0.2.10"
libc = "0.2"
