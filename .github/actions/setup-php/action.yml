name: Set up php for rhp's differential tests
description: >
  Install php and php-cgi via setup-php, plus `php` / `php-cgi` shims that
  force-load shared extensions whenever the harness runs them with `-n`.

# rhp's harness runs php with `-n` (no ini) for deterministic output.
# Debian/Ubuntu php ships most extensions as shared modules enabled via ini,
# which `-n` drops. Homebrew php compiles them all in statically, so `-n` keeps
# them there. The shim closes that gap: when `-n` is present, it loads every
# wanted extension from the command line (which `-n` does not affect). It
# injects an extension only if its .so exists and php hasn't compiled it in.
# Either mistake would print a startup warning to stdout and corrupt every
# comparison. Non-`-n` invocations pass through untouched. make-shims.sh
# writes them (also used by .github/scripts/linux-ci.Dockerfile).
#
# php-cgi (the reference for CGI .phpt tests and `rhp-difftest app`) gets the
# same shim, next to the `php` one: the harness finds php-cgi beside php.

inputs:
  php-version:
    description: php version for setup-php (e.g. '8.5')
    required: true
  extra-extensions:
    description: >-
      More extensions to install and to load under -n, comma-separated, in
      load order (e.g. 'pdo, pdo_sqlite' for a fixture app that needs them)
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Debian/Ubuntu php reads the system zoneinfo, and Ubuntu moved the
    # legacy zone names (US/Eastern, EST5EDT, GMT+0, ...) to tzdata-legacy.
    # Without it php rejects IDs the php-src date tests use.
    - name: Install legacy timezone names
      shell: bash
      run: |
        if command -v apt-get >/dev/null 2>&1; then
          sudo apt-get install -y --no-install-recommends tzdata-legacy || true
        fi
    - uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: >-
          bcmath, bz2, calendar, ctype, curl, dom, exif, fileinfo, gettext, gmp, iconv,
          intl, mbstring, pcntl, phar, posix, shmop, simplexml, sockets, sodium,
          sysvmsg, sysvsem, sysvshm, tokenizer, xml, xmlreader, xmlwriter, zip${{ inputs.extra-extensions != '' && format(', {0}', inputs.extra-extensions) || '' }}
        coverage: none

    # setup-php's php can ship newer shared libraries than the distro's,
    # outside dpkg (on Ubuntu 26.04: libpcre2-8.so.0.15.0, PCRE2 10.47, which
    # php was compiled against). The SONAME link keeps naming the distro's
    # copy until ldconfig runs, and any later apt install runs it. Run it now
    # so php loads its own libraries from here on and every step, the
    # library report included, sees the same php.
    - name: Activate the libraries php ships
      shell: bash
      run: |
        if command -v ldconfig >/dev/null 2>&1; then sudo ldconfig; fi

    # The php-cgi must be the same build as php: a runner-image php-cgi of
    # another minor version on PATH would make every CGI comparison
    # meaningless. Debian names it php-cgi<major.minor>.
    - name: Make sure the matching php-cgi is installed
      shell: bash
      run: |
        v="$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')"
        full="$(php -r 'echo PHP_VERSION;')"
        if ! command -v "php-cgi$v" >/dev/null 2>&1; then
          echo "setup-php installed no php-cgi$v; installing php$v-cgi"
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends "php$v-cgi"
        fi
        cgi="$(command -v "php-cgi$v")"
        ver="$("$cgi" -n -v)"
        ver="${ver%%$'\n'*}"
        echo "$cgi: $ver"
        case "$ver" in
          "PHP $full "*) ;;
          *) echo "$cgi is not php $full"; exit 1 ;;
        esac

    - name: Install php and php-cgi shims that force-load extensions under -n
      shell: bash
      run: |
        # shellcheck disable=SC2086 # one word per extension
        "$GITHUB_ACTION_PATH/make-shims.sh" "$HOME/php-shim" $(tr ',' ' ' <<<"$EXTRA")
        echo "$HOME/php-shim" >> "$GITHUB_PATH"
      env:
        EXTRA: ${{ inputs.extra-extensions }}

    - name: Confirm extensions load under -n with clean stdout
      shell: bash
      run: |
        echo "default: $(php --version | head -1)"
        echo "modules under -n: $(php -n -m | tr '\n' ' ')"
        out="$(php -n -r 'echo "ok";')"
        if [ "$out" != "ok" ]; then
          echo "php -n prints startup noise on stdout:"; echo "$out"; exit 1
        fi
        php -n -r 'foreach (["bcmath","ctype","gmp","mbstring","phar"] as $e) { if (!extension_loaded($e)) { fwrite(STDERR, "missing $e\n"); exit(1); } } echo "required extensions loaded\n";'
        # php-cgi: a CGI request must answer with headers and a clean body.
        dir="$(mktemp -d)"
        echo '<?php echo implode(",", array_map("strtolower", get_loaded_extensions()));' > "$dir/t.php"
        out="$(env -i PATH="$PATH" REDIRECT_STATUS=1 REQUEST_METHOD=GET SCRIPT_FILENAME="$dir/t.php" php-cgi -n -d opcache.enable=0)"
        rm -rf "$dir"
        echo "php-cgi -n: $(command -v php-cgi)"; echo "$out"
        body="$(printf '%s' "$out" | sed '1,/^\r\?$/d')"
        for e in mbstring ctype tokenizer dom; do
          if ! tr ',' '\n' <<<"$body" | grep -qx "$e"; then
            echo "php-cgi -n is missing $e (or printed startup noise)"; exit 1
          fi
        done

    # What this php links (docs/design/libraries.md): rhp must link the same
    # library versions, and ref_build.rs checks the ones it already does.
    - name: Report the libraries php links
      shell: bash
      run: |
        php -n -i | grep -E '^(PCRE (Library|Unicode) Version|PCRE JIT|libXML (Compiled|Loaded) Version|ICU (version|Data version|Unicode version)|cURL Information|SSL Version|ZLib Version|libSSH Version|OpenSSL (Library|Header) Version|Libzip version|GMP version|iconv (implementation|library version)|Multibyte regex \(oniguruma\) version|("Olson" )?Timezone Database|Compiled Version|Linked Version|SQLite Library)' || true
        # shellcheck disable=SC2016 # PHP code, not shell
        php -n -r 'echo "PCRE2 headers php was compiled with => ", PCRE_VERSION_MAJOR, ".", PCRE_VERSION_MINOR, "\n";'
        # On Linux PHP_BINARY is the shim script (make-shims.sh); list the
        # executable the kernel actually runs.
        bin="$(php -n -r 'echo @readlink("/proc/self/exe") ?: PHP_BINARY;')"
        extdir="$(php-config --extension-dir)"
        loaded="$(php -n -m | tr 'A-Z' 'a-z')"
        list() { if command -v ldd >/dev/null 2>&1; then ldd "$1"; else otool -L "$1"; fi; }
        echo "== $bin"; list "$bin"
        for so in "$extdir"/*.so; do
          if grep -qx "$(basename "$so" .so)" <<<"$loaded"; then
            echo "== $so"; list "$so"
          fi
        done
