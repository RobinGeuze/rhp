name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. force-push to a PR branch).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only token, whatever the repository default is.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Formatting: cheap, fail fast.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Lints, warnings treated as errors.
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/native-deps
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # The whole cargo suite, once, with NO `php` on PATH: goldens, CLI and curl
  # fixtures compare rhp with php output committed from the reference php
  # (crates/rhp-builtins/src/version.rs); unit and request-layer tests hold
  # their own expectations; every live-php test guards on `php_available()`
  # and skips. Proves the suite is green for a contributor without php
  # installed. (ubuntu-latest ships its own php, so we remove it first.)
  test:
    name: test (no php)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Remove the runner's pre-installed php
        run: |
          sudo update-alternatives --remove-all php >/dev/null 2>&1 || true
          sudo rm -f /usr/bin/php* /usr/local/bin/php* || true
          if command -v php >/dev/null 2>&1; then
            echo "php still on PATH at $(command -v php)"; exit 1
          fi
          echo "no php on PATH — live-php tests will skip"
      - uses: ./.github/actions/native-deps
      - run: cargo test --workspace --all-targets --no-fail-fast

  # The live checks against real php 8.5, the version rhp targets (another
  # minor version is no reference); the no-php job ran everything else.
  # tools/rhp-difftest/tests compare with php at test time (the hash,
  # bcmath, ctype, gmp, mbstring, password and crypt sweeps with the
  # binary's default seed and corpus plus more seeds, curl, libxml2, ICU,
  # OpenSSL, zip, ...); so do rhp-cli's tests, which need the rhp binary.
  # All of rhp-cli's test targets run, so a new live test is covered; only
  # the goldens (diff.rs, php-free and the slowest) are skipped. Then the
  # committed expectations (CLI fixtures, portable goldens) must still be
  # what this php prints.
  php:
    name: php 8.5 (live)
    runs-on: ubuntu-latest
    env:
      RHP_PHP: php
    steps:
      - uses: actions/checkout@v7
      # php + a shim so `php -n` keeps the shared extensions (see the action).
      - uses: ./.github/actions/setup-php
        with:
          php-version: '8.5'
      # After setup-php: rhp links the library versions this php links.
      - uses: ./.github/actions/native-deps
      # The PHP prelude files (crates/rhp-builtins/src/**/*.php, no open
      # tag) must stay valid php. Some declare functions under php's own
      # names, which php would refuse to redeclare: they are disabled.
      - name: Prelude files pass php -l
        run: |
          rc=0
          for f in $(git ls-files 'crates/rhp-builtins/src/*.php'); do
            fns=$({ grep -oE '^function +&?[A-Za-z_][A-Za-z0-9_]*' "$f" || true; } | sed -E 's/^function +&?//' | paste -sd, -)
            out=$({ echo '<?php'; cat "$f"; } | php -n -d "disable_functions=$fns" -l 2>&1) || { echo "$f: $out"; rc=1; }
          done
          exit $rc
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: rhp-difftest's live-php tests
        run: cargo test -p rhp-difftest --tests --no-fail-fast
      # The CGI fixtures run the real php-cgi, not the shim: the shim's
      # extra `-d extension=…` arguments change php-cgi's option parsing
      # (argument numbers, `-q`, script detection), and bash reorders the
      # environment that getallheaders() reports. They need no shared ext.
      - name: rhp-cli's live-php tests
        if: ${{ !cancelled() }}
        run: |
          export RHP_PHP_CGI="$(command -v php-cgi8.5)"
          echo "RHP_PHP_CGI=$RHP_PHP_CGI"
          cargo test -p rhp-cli --no-fail-fast --tests -- --skip vm_matches_php_baseline
      - name: CLI fixtures still match php
        if: ${{ !cancelled() }}
        run: cargo test -p rhp-cli --test cli -- --check
      # Except the ones holding the reference build's facts
      # (tests/golden/reference-only.txt).
      - name: Portable goldens still match php
        if: ${{ !cancelled() }}
        run: cargo run -q -p rhp-difftest -- golden --check --portable

  # One release build of rhp and rhp-difftest, shared with the phpt shards,
  # the generated tables and the apps as an artifact. setup-php first: rhp
  # links the library versions that php links (native-deps), and the jobs
  # using the build run the same php.
  build:
    name: release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-php
        with:
          php-version: '8.5'
      - uses: ./.github/actions/native-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p rhp-cli -p rhp-difftest
      # A tarball keeps the executable bits, which an artifact drops. The
      # binaries contain php-src code, LGPL libmbfl and statically linked C
      # libraries, whose licences ask for their notices to go with a binary.
      - run: >-
          tar -cf release.tar target/release/rhp target/release/rhp-difftest
          LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.tar
          # Long enough to re-run a failed job of an older run.
          retention-days: 5

  # php-src .phpt ratchet: every test in tests/phpt/known-passing.txt must
  # still match php. The list is generated by `rhp-difftest phpt --write-known`
  # against the php-src commit pinned in tests/phpt/php-src.ref; the nightly
  # workflow reports newly passing tests to add. Three runners take every
  # third test each (--shard).
  phpt:
    name: phpt ratchet ${{ matrix.shard }}/3 (php 8.5)
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - name: Read pinned php-src commit
        id: ref
        run: echo "sha=$(grep -v '^#' tests/phpt/php-src.ref | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: php/php-src
          ref: ${{ steps.ref.outputs.sha }}
          path: php-src
          persist-credentials: false
          # Every php-src test (non-cone, as the nightly does): tests/
          # includes tests/basic; sapi/cgi/tests, ext/session/tests and a few
          # others hold CGI tests (--GET--/--POST--/--CGI--/...), run under
          # php-cgi; tests also include helpers from other trees' tests/
          # directories; ext/*/*/tests/ is ext/intl/uchar/tests.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Zend/tests/
            /tests/
            /ext/*/tests/
            /ext/*/*/tests/
            /sapi/*/tests/
      - uses: ./.github/actions/setup-php
        with:
          php-version: '8.5'
      # The libraries the build links dynamically (libzip, libgmp, libcurl's).
      - uses: ./.github/actions/native-deps
      - uses: actions/download-artifact@v4
        with:
          name: release
      - run: tar -xf release.tar
      # --timeout 30: the oom_* tests build hundreds of MB before failing;
      # rhp needs ~2.5s CPU for oom_unserialize_001 and crossed the default
      # 10s on a busy runner.
      - name: Known-passing php-src tests still match
        run: >-
          target/release/rhp-difftest phpt --php-src php-src
          --php-cgi "$(command -v php-cgi)" --timeout 30
          --check-known tests/phpt/known-passing.txt --shard ${{ matrix.shard }}/3

  # AddressSanitizer over the code that frees libxml2 trees: the php-src
  # tests in tests/asan/phpts.txt and the stress scripts in tests/asan. rhp's
  # Rust is instrumented, the C libraries are not; ASan's allocator still
  # catches their double and invalid frees. Leak checking is off: rhp does
  # not free everything at exit.
  asan:
    name: asan (libxml2 trees)
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
      RHP_ASAN: target/x86_64-unknown-linux-gnu/release
    steps:
      - uses: actions/checkout@v7
      - name: Read pinned php-src commit
        id: ref
        run: echo "sha=$(grep -v '^#' tests/phpt/php-src.ref | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: php/php-src
          ref: ${{ steps.ref.outputs.sha }}
          path: php-src
          persist-credentials: false
          # As the phpt job: --check-known needs every ignored test present.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Zend/tests/
            /tests/
            /ext/*/tests/
            /ext/*/*/tests/
            /sapi/*/tests/
      - uses: ./.github/actions/setup-php
        with:
          php-version: '8.5'
      - uses: ./.github/actions/native-deps
      # A dated nightly, bumped on purpose: a broken nightly does not turn
      # every PR red, and the cache keeps the instrumented build.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-15
      - uses: Swatinem/rust-cache@v2
        with:
          key: asan
      # --target keeps the sanitizer off build scripts and proc macros.
      # cc passes -fsanitize=address to the vendored C too; CFLAGS turns that
      # off. Instrumented, GCC's identical-variable folding puts two static
      # libmbfl tables at one address, which ASan reports as an ODR violation.
      - name: Build with AddressSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=address
          CFLAGS: -fno-sanitize=address
        run: cargo build --release --target x86_64-unknown-linux-gnu -p rhp-cli -p rhp-difftest
      - name: Stress scripts
        run: |
          for f in tests/asan/*.php; do
            out="$("$RHP_ASAN/rhp" "$f")"
            echo "$f: $out"
            [ "$out" = ok ]
          done
      - name: php-src tests
        run: >-
          "$RHP_ASAN/rhp-difftest" phpt --php-src php-src --rhp "$RHP_ASAN/rhp"
          --timeout 60 --check-known tests/asan/phpts.txt

  # The committed generated tables still match their sources: php-src's
  # stubs and C bodies (builtin signatures), stubs (intl, curl, zip) and
  # entity tables, php-src's .phpt files (tests/phpt/totals.txt, under the
  # README's test table), and the Bison output in the php release tarball
  # (the git tag has none). The tarball is pinned in tools/php-dist.sha256
  # and cached on that pin, so php.net is fetched once per release.
  generated:
    name: generated tables
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read pinned php-src commit
        id: ref
        run: echo "sha=$(grep -v '^#' tests/phpt/php-src.ref | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: php/php-src
          ref: ${{ steps.ref.outputs.sha }}
          path: php-src
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            **/*.stub.php
            /Zend/**/*.c
            /main/**/*.c
            /ext/**/*.c
            /sapi/cgi/*.c
            /sapi/cli/*.c
            /ext/standard/html_tables/
            /ext/standard/html_tables.h
            /ext/curl/curl_private.h
            **/*.phpt
      - uses: actions/cache@v4
        with:
          path: php-dist
          key: php-dist-${{ hashFiles('tools/php-dist.sha256') }}
      - name: Fetch and verify the pinned php release
        run: |
          name=$(awk '{print $2}' tools/php-dist.sha256)
          mkdir -p php-dist
          if [ ! -f "php-dist/$name" ]; then
            curl -fsSL --retry 3 -o "php-dist/$name" "https://www.php.net/distributions/$name"
          fi
          (cd php-dist && sha256sum -c ../tools/php-dist.sha256)
          dir=${name%.tar.xz}
          tar -xJf "php-dist/$name" -C "$RUNNER_TEMP" "$dir/Zend" "$dir/main/php_version.h"
          echo "PHP_DIST=$RUNNER_TEMP/$dir" >> "$GITHUB_ENV"
      # The libraries the build links dynamically.
      - uses: ./.github/actions/native-deps
      - uses: actions/download-artifact@v4
        with:
          name: release
      - run: tar -xf release.tar
      - run: target/release/rhp-difftest gen signatures --php-src php-src --check
      - run: target/release/rhp-difftest gen html-tables --php-src php-src --check
      - run: target/release/rhp-difftest gen intl-consts --php-src php-src --check
      - run: target/release/rhp-difftest gen parser --php-dist "$PHP_DIST" --check
      - run: target/release/rhp-difftest gen curl-consts --php-src php-src --check
      - run: target/release/rhp-difftest gen zip-consts --php-src php-src --check
      # Recounts tests/phpt/totals.txt from every .phpt file (cargo test
      # checks README.md's table against the committed one, without php-src).
      - name: README test table and php-src test totals are current
        run: target/release/rhp-difftest gen readme --php-src php-src --check

  # Pinned framework fixture apps (tests/apps/apps.toml): the matrix is read
  # from the manifest, so adding an app version needs no workflow change.
  apps-matrix:
    name: fixture apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.m.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
      - id: m
        run: echo "apps=$(python3 tests/apps/apps.py matrix)" >> "$GITHUB_OUTPUT"

  # Per app: install vendor/ from the lockfile (no composer scripts; cached on
  # the lockfile hash), smoke-test its routes under php, then the compile-only
  # ratchet: `rhp-difftest lint --check-known` fails only on a file rhp newly
  # refuses; listed files that now compile are a notice, never a failure.
  # Last, the request diff ratchet (`rhp-difftest app --check-known`).
  apps-lint:
    name: app ${{ matrix.app }}
    needs: [apps-matrix, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.apps-matrix.outputs.apps) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-php
        with:
          php-version: '8.5'
      # The libraries the build links dynamically.
      - uses: ./.github/actions/native-deps
      - uses: actions/cache@v4
        with:
          path: tests/apps/${{ matrix.app }}/vendor
          key: apps-vendor-${{ matrix.app }}-${{ hashFiles(format('tests/apps/{0}/composer.lock', matrix.app)) }}
      - uses: actions/download-artifact@v4
        with:
          name: release
      - run: tar -xf release.tar
      - name: Install and set up the app
        run: python3 tests/apps/apps.py setup ${{ matrix.app }}
      - name: Smoke-test the app under php
        run: python3 tests/apps/apps.py smoke ${{ matrix.app }}
      - name: No new compile refusals
        run: python3 tests/apps/apps.py lint ${{ matrix.app }}
      # The request corpus through php-cgi and `rhp --cgi`: fails only when a
      # request in known-passing-requests.txt stops answering like php-cgi.
      - name: Known requests still answer like php-cgi
        run: python3 tests/apps/apps.py diff ${{ matrix.app }}
