; The php.ini that tools.py gives both engines (PHPRC), so php does not read
; its own distribution's file while rhp reads none. The values are those of
; php-src's php.ini-development, which distribution files start from.
;
; Two of them test the engines rather than the tools:
; - max_execution_time = 30: the CLI forces 0 over php.ini (php_cli.c's
;   HARDCODED_INI), so a long analysis must not be killed after 30 s;
; - log_errors = On without error_log: the CLI logs each error to stderr
;   ("PHP Warning:  ...") as well as displaying it.

[PHP]
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
implicit_flush = Off
serialize_precision = -1
zend.enable_gc = On
zend.exception_ignore_args = Off
zend.exception_string_param_max_len = 15
max_execution_time = 30
max_input_time = 60
memory_limit = 128M
error_reporting = E_ALL
display_errors = On
display_startup_errors = On
log_errors = On
ignore_repeated_errors = Off
ignore_repeated_source = Off
variables_order = "GPCS"
request_order = "GP"
default_charset = "UTF-8"
allow_url_fopen = On
allow_url_include = Off

[Assertion]
zend.assertions = 1
