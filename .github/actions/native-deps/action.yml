name: Install rhp's native build dependencies
description: >
  Installs the C libraries rhp links (docs/design/libraries.md), at the
  versions the reference php links. Every job that builds rhp uses this. To
  add a library, add its -dev package here and its row in
  crates/rhp-builtins/build/native.rs.

inputs:
  php:
    description: >
      The php whose library versions rhp must link. Run this action after that
      php is installed. Empty: `php` if one is on PATH, else the distro's
      versions.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install native build dependencies
      id: apt
      shell: bash
      env:
        PHP_BIN: ${{ inputs.php }}
      run: |
        # PCRE2 (libpcre2-8.a), libxml2 (libxml2.a), ICU (libicu*.a),
        # OpenSSL (libcrypto.a, libssl.a) and libcurl (libcurl.a), linked
        # statically. Ubuntu's libcrypto.a also needs its Libs.private, which
        # libssl-dev does not pull in: -l:libjitterentropy.a -lz -lzstd.
        # libcurl.a's own dependencies are linked dynamically; Ubuntu 26.04's
        # libcurl4-openssl-dev pulls in their -dev packages, 24.04's does not.
        # libsqlite3 (libsqlite3.a) is linked statically too.
        # libzip and libgmp (LGPL) are linked dynamically: libzip-dev ships no
        # static archive. libgd too: its codecs have no complete static set.
        # libedit (readline) is linked dynamically, as php does.
        sudo apt-get update -q
        sudo apt-get install -y --no-install-recommends \
          pkg-config \
          libpcre2-dev \
          libxml2-dev \
          libicu-dev \
          libssl-dev \
          libjitterentropy3-dev \
          zlib1g-dev \
          libzstd-dev \
          libcurl4-openssl-dev \
          libbrotli-dev libidn2-dev libkrb5-dev libldap-dev libnghttp2-dev \
          libpsl-dev librtmp-dev libssh-dev libssh2-1-dev \
          libzip-dev \
          libgd-dev \
          libgmp-dev \
          libsqlite3-dev \
          libedit-dev
        php="${PHP_BIN:-$(command -v php || true)}"
        build=""
        # compare <name> <pkg-config module> <php code printing the version php loads>
        compare() {
          local have want
          have="$(pkg-config --modversion "$2")"
          want="$have"
          if [ -n "$php" ]; then want="$("$php" -n -r "$3")"; fi
          echo "$1: the distro has $have; ${php:-no php} links $want"
          if [ "$want" != "$have" ]; then build="$build $1-$want"; fi
        }
        # shellcheck disable=SC2016 # PHP code, not shell
        compare pcre2 libpcre2-8 'echo strtok(PCRE_VERSION, " ");'
        # shellcheck disable=SC2016
        compare libxml2 libxml-2.0 '$v = (int) LIBXML_LOADED_VERSION; echo intdiv($v, 10000), ".", intdiv($v, 100) % 100, ".", $v % 100;'
        # ICU has no source build here: its release must be the distro's.
        if [ -n "$php" ]; then
          have="$(pkg-config --modversion icu-uc)"
          want="$("$php" -n -r 'echo defined("INTL_ICU_VERSION") ? INTL_ICU_VERSION : "";')"
          echo "icu: the distro has $have; $php links ${want:-no intl}"
          if [ -n "$want" ] && [ "$want" != "$have" ]; then
            echo "::error::php links ICU $want but libicu-dev is $have; rhp must link php's ICU (docs/design/libraries.md)"
            exit 1
          fi
        fi
        if [ -n "$php" ]; then
          # libcurl has no source build here: php must link the distro's.
          # shellcheck disable=SC2016
          curl_want="$("$php" -n -r 'echo function_exists("curl_version") ? curl_version()["version"] : "";')"
          curl_have="$(pkg-config --modversion libcurl)"
          echo "libcurl: the distro has $curl_have; $php links ${curl_want:-no libcurl}"
          if [ -n "$curl_want" ] && [ "$curl_want" != "$curl_have" ]; then
            echo "::error::$php links libcurl $curl_want, but the distro's libcurl4-openssl-dev is $curl_have. rhp links the distro's libcurl.a and cannot build another release."
            exit 1
          fi
          # libgmp has no source build here: php must load the distro's.
          # shellcheck disable=SC2016
          gmp_want="$("$php" -n -r 'echo defined("GMP_VERSION") ? GMP_VERSION : "";')"
          gmp_have="$(pkg-config --modversion gmp)"
          echo "gmp: the distro has $gmp_have; $php loads ${gmp_want:-no gmp}"
          if [ -n "$gmp_want" ] && [ "$gmp_want" != "$gmp_have" ]; then
            echo "::error::$php loads libgmp $gmp_want, but the distro's libgmp-dev is $gmp_have; rhp links the distro's"
            exit 1
          fi
          # libzip has no source build here either.
          # shellcheck disable=SC2016
          zip_want="$("$php" -n -r 'echo class_exists("ZipArchive") ? ZipArchive::LIBZIP_VERSION : "";')"
          zip_have="$(pkg-config --modversion libzip)"
          echo "libzip: the distro has $zip_have; $php links ${zip_want:-no libzip}"
          if [ -n "$zip_want" ] && [ "$zip_want" != "$zip_have" ]; then
            echo "::error::$php links libzip $zip_want, but the distro's libzip-dev is $zip_have; rhp links the distro's libzip"
            exit 1
          fi
          # libgd has no source build here either: ext/gd must load the
          # distro's.
          # shellcheck disable=SC2016
          gd_want="$("$php" -n -r 'echo defined("GD_VERSION") ? GD_VERSION : "";')"
          gd_have="$(pkg-config --modversion gdlib)"
          echo "libgd: the distro has $gd_have; $php links ${gd_want:-no gd}"
          if [ -n "$gd_want" ] && [ "$gd_want" != "$gd_have" ]; then
            echo "::error::$php links libgd $gd_want, but the distro's libgd-dev is $gd_have; rhp links the distro's"
            exit 1
          fi
          # libsqlite3 has no source build here either: pdo_sqlite must load
          # the distro's.
          # shellcheck disable=SC2016
          sqlite_want="$("$php" -n -r 'echo class_exists("PDO") && in_array("sqlite", PDO::getAvailableDrivers()) ? (new PDO("sqlite::memory:"))->getAttribute(PDO::ATTR_CLIENT_VERSION) : "";')"
          sqlite_have="$(pkg-config --modversion sqlite3)"
          echo "sqlite3: the distro has $sqlite_have; $php loads ${sqlite_want:-no pdo_sqlite}"
          if [ -n "$sqlite_want" ] && [ "$sqlite_want" != "$sqlite_have" ]; then
            echo "::error::$php loads libsqlite3 $sqlite_want, but the distro's libsqlite3-dev is $sqlite_have; rhp links the distro's"
            exit 1
          fi
          # rhp's LIBXML_DOTTED_VERSION is its headers' and LIBXML_LOADED_VERSION
          # its library's: one release. php can differ only if it loads a
          # libxml2 other than the one it was compiled against.
          # shellcheck disable=SC2016
          "$php" -n -r 'echo "libxml2: php compiled against ", LIBXML_DOTTED_VERSION, ", loads ", LIBXML_LOADED_VERSION, "\n";'
        fi
        # OpenSSL is not built from source: php must load the distro's release.
        have="$(pkg-config --modversion libcrypto)"
        if [ -n "$php" ]; then
          # shellcheck disable=SC2016
          want="$("$php" -n -r 'ob_start(); phpinfo(INFO_MODULES); preg_match("/^OpenSSL Library Version => OpenSSL (\\S+)/m", ob_get_clean(), $m); echo $m[1] ?? "";')"
          echo "openssl: the distro has $have; $php loads $want"
          if [ -n "$want" ] && [ "$want" != "$have" ]; then
            echo "::error::php loads OpenSSL $want but the distro's libssl-dev is $have; rhp links the distro's"
            exit 1
          fi
        fi
        echo "build=${build# }" >> "$GITHUB_OUTPUT"
        echo "os=$(. /etc/os-release && echo "$ID-$VERSION_ID")" >> "$GITHUB_OUTPUT"

    # php links a release the distro has no -dev package for (setup-php's php
    # on a new Ubuntu ships its own newer libpcre2-8.so). Build that release
    # from its checksummed tarball, static only, and point pkg-config at it.
    - name: Restore source builds (${{ steps.apt.outputs.build }})
      if: steps.apt.outputs.build != ''
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/rhp-native
        key: native-${{ steps.apt.outputs.build }}-${{ steps.apt.outputs.os }}-${{ runner.arch }}-${{ hashFiles('.github/actions/native-deps/**') }}
    - name: Build the releases php links (${{ steps.apt.outputs.build }})
      if: steps.apt.outputs.build != '' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        BUILD: ${{ steps.apt.outputs.build }}
      run: |
        for lib in $BUILD; do
          "$GITHUB_ACTION_PATH/build-from-source.sh" "${lib%-*}" "${lib##*-}"
        done
    - name: Use the source builds
      if: steps.apt.outputs.build != ''
      shell: bash
      env:
        BUILD: ${{ steps.apt.outputs.build }}
      run: |
        path="${PKG_CONFIG_PATH:-}"
        for lib in $BUILD; do
          path="$HOME/.cache/rhp-native/$lib/lib/pkgconfig${path:+:$path}"
        done
        echo "PKG_CONFIG_PATH=$path" >> "$GITHUB_ENV"
        PKG_CONFIG_PATH="$path" pkg-config --modversion libpcre2-8 libxml-2.0
