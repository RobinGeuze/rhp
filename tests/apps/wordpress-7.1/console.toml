# Console battery for wp-cli (`python3 tests/apps/apps.py console`; format
# in console.py): wp-cli commands, `eval` one-liners and `eval-file` probes
# (console/*.php). Each command starts from the database setup.php made, so a
# command that writes is compared by the database's SQL dump.

# WordPress core's own code and wp-cli never change at run time.
shared = ["wordpress/wp-admin", "wordpress/wp-includes", "wp-cli.phar"]
ini = ["memory_limit=512M"]
# The first boots schedule WordPress's recurring cron events at the time of
# the run; events due in the same second share one entry, so a command that
# scheduled them would write a different `cron` option every run. Boot once
# with php (a plain boot, and an admin one for the admin-only events) so the
# pristine database has them all.
prepare = ["wp-cli.phar cron event list", "wp-cli.phar eval-file console/health.php"]

# Times of the run: post and comment dates, transients, cron.
[[mask]]
name = "now-epoch"
builtin = "now-epoch"
in = ["stdout", "stderr", "files"]

[[mask]]
name = "now-datetime"
builtin = "now-datetime"
in = ["stdout", "stderr", "files"]

# The export's channel date is the time of the run.
[[mask]]
name = "export-date"
pattern = '<pubDate>[^<]*</pubDate>(\n<language>)'
replace = '<pubDate><NOW></pubDate>\1'
in = ["stdout"]
commands = ["export"]

# Site Health's server time.
[[mask]]
name = "health-time"
pattern = 'utc-time=.*'
replace = 'utc-time=<NOW>'
in = ["stdout"]
commands = ["e-health"]

# Password hashes are salted at random.
[[mask]]
name = "password-hash"
pattern = '\$wp\$2y\$\d\d\$[./A-Za-z0-9]{53}|\$P\$[./A-Za-z0-9]{31}'
replace = "<PASSWORD_HASH>"
in = ["stdout", "stderr", "files"]

# wpdb escapes % in queries with a random placeholder (wpdb::placeholder_escape).
[[mask]]
name = "placeholder-escape"
pattern = '\{[0-9a-f]{64}\}'
replace = "{<PLACEHOLDER>}"
in = ["stdout", "stderr", "files"]

