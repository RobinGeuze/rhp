[package]
name = "rhp-builtins"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rhp-values = { path = "../rhp-values" }
rhp-semantics = { path = "../rhp-semantics" }
pcre2-sys = "0.2.10"
libc = "0.2"

# `hash` extension algorithms. Pure-Rust (RustCrypto et al.) where a faithful
# 1:1 implementation exists; the oddballs with no crate (snefru, haval, php's
# 4-pass tiger, the murmur/fnv/crc/adler variants) are hand-rolled in `hash/`.
digest = "0.11"
md2 = "0.11"
md4 = "0.11"
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
sha3 = "0.12"
ripemd = "0.2"
whirlpool = "0.11"
tiger = "0.3"
gost94 = "0.11"
xxhash-rust = { version = "0.8", features = ["xxh32", "xxh64", "xxh3"] }

# bcmath + gmp: arbitrary-precision integers (the decimal/scale semantics for
# bcmath are PHP-specific and hand-rolled in ext/bcmath).
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"

# password_* : bcrypt + argon2 password hashing (faithful Rust 1:1).
bcrypt = "0.17"
argon2 = "0.6"
password-hash = { version = "0.6", features = ["phc", "alloc"] }

# zlib + phar per-file compression + ZipArchive writing: raw DEFLATE / zlib /
# gzip. Backed by C zlib (system libz, or libz-sys's bundled copy) rather than
# miniz_oxide so compressed bytes are identical to php's (which links zlib).
flate2 = { version = "1.1", default-features = false, features = ["zlib"] }
# Direct zlib calls where php's exact deflateInit2 parameters matter (memLevel 9,
# sync flushes): gzencode & co., the compress.zlib:// wrapper, ZipArchive.
libz-sys = "1.1"

# phar per-file bzip2 compression (pure-Rust backend, no libbz2 dependency).
bzip2 = "0.5"

# openssl extension: pure-Rust X.509 certificate parsing (openssl_x509_parse).
x509-parser = { version = "0.18", features = ["verify"] }

# HTTP(S) client for the stream http:// / https:// wrappers (rustls TLS with
# bundled Mozilla roots — no system OpenSSL dependency).
ureq = "2.12"
# URL joining for curl redirects (already in the tree via ureq).
url = "2.5"
# ext/curl's own HTTP/1.1 transport: the Mozilla roots ureq bundles, plus the
# brotli / zstd decoders behind CURLOPT_ENCODING (libcurl's "deflate, gzip,
# br, zstd"). All pure Rust.
webpki-roots = "0.26"
brotli-decompressor = "4"
ruzstd = "0.8"

# zip extension: reading/extracting .zip archives (ZipArchive). Pure-Rust
# (deflate via the same miniz_oxide backend as flate2).
zip = { version = "2.2", default-features = false, features = ["deflate"] }

# CSPRNG for random_bytes/random_int/mt_rand.
getrandom = "0.2"

# intl extension: ICU4X grapheme segmentation, normalization (incl. the UTS #46
# mapping) and character properties, plus the idna crate's Punycode codec.
# (icu_normalizer / icu_properties / idna were already in the tree via url.)
icu_segmenter = "2"
icu_normalizer = "2"
icu_properties = "2"
idna = "1"
