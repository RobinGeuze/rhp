[package]
name = "rhp-vm"
edition.workspace = true
version.workspace = true
# Our code: MIT OR Apache-2.0; code translated from php-src (main/output.c) keeps
# the PHP License 3.01 (THIRD-PARTY-NOTICES, section 4).
license = "(MIT OR Apache-2.0) AND PHP-3.01"
publish.workspace = true

[features]
default = []

[dependencies]
rhp-values = { path = "../rhp-values" }
rhp-bytecode = { path = "../rhp-bytecode" }
rhp-semantics = { path = "../rhp-semantics" }
rhp-builtins = { path = "../rhp-builtins" }
indexmap = { workspace = true }
rustc-hash = { workspace = true }

[dev-dependencies]
rhp-compiler = { path = "../rhp-compiler" }
rhp-frontend = { path = "../rhp-frontend" }
