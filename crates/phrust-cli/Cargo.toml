[package]
name = "phrust-cli"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "phrust"
path = "src/main.rs"

[features]
default = []
# Enable the Zend macro-shim prototype builtins (__zendshim_*). Off by default.
zendshim = ["phrust-vm/zendshim", "phrust-oracle/zendshim"]

[dependencies]
phrust-oracle = { path = "../phrust-oracle" }
phrust-compiler = { path = "../phrust-compiler" }
phrust-vm = { path = "../phrust-vm" }
phrust-frontend = { path = "../phrust-frontend" }
phrust-values = { path = "../phrust-values" }
