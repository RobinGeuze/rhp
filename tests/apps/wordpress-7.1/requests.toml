[[request]]
id = "login-bad"
method = "POST"
path = "/wp-login.php"
headers = ["Cookie: wordpress_test_cookie=WP%20Cookie%20check"]
content_type = "application/x-www-form-urlencoded"
body = "log=admin&pwd=wrong&wp-submit=Log+In&testcookie=1"
status = 200

[[request]]
id = "login-ok"
method = "POST"
path = "/wp-login.php"
headers = ["Cookie: wordpress_test_cookie=WP%20Cookie%20check"]
content_type = "application/x-www-form-urlencoded"
body = "log=admin&pwd=rhp-fixture-password&wp-submit=Log+In&testcookie=1&redirect_to=%2Fwp-admin%2F"
status = 302

[[request]]
id = "xmlrpc-methods"
method = "POST"
path = "/xmlrpc.php"
content_type = "text/xml"
body = "<?xml version=\"1.0\"?><methodCall><methodName>system.listMethods</methodName><params></params></methodCall>"
status = 200

[[request]]
id = "xmlrpc-getposts"
method = "POST"
path = "/xmlrpc.php"
content_type = "text/xml"
body = "<?xml version=\"1.0\"?><methodCall><methodName>wp.getPosts</methodName><params><param><value><int>1</int></value></param><param><value><string>admin</string></value></param><param><value><string>rhp-fixture-password</string></value></param></params></methodCall>"
status = 200

[[request]]
id = "comment-post"
method = "POST"
path = "/wp-comments-post.php"
content_type = "application/x-www-form-urlencoded"
body = "comment=Hello+there&author=Ann&email=ann%40example.com&url=&comment_post_ID=1&comment_parent=0"
status = 302
# Not in the warm-up run, or the database would already hold this comment
# and both engines would answer 409 (duplicate comment).
warmup = false

[[request]]
id = "ajax-heartbeat"
method = "POST"
path = "/wp-admin/admin-ajax.php"
headers = ["X-Rhp-User: 1"]
content_type = "application/x-www-form-urlencoded"
body = "action=heartbeat&interval=60&_nonce=x&screen_id=dashboard"
status = 200
