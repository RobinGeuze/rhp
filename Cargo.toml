[workspace]
resolver = "2"
members = ["crates/*", "tools/*"]
exclude = ["vendor/mago-syntax"]

[workspace.package]
edition = "2021"
version = "0.0.0"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
mago-syntax = "1.58"
mago-allocator = "1.58"
mago-database = "1.58"
mago-syntax-core = "1.58"
mago-span = "1.58"
bstr = "1.13"
indexmap = "2.14"
rustc-hash = "2"
smallvec = "1.16"

# mago-syntax with rhp's lexer fixes (vendor/mago-syntax/PATCHES.md).
[patch.crates-io]
mago-syntax = { path = "vendor/mago-syntax" }
