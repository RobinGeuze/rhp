# Pinned framework fixture apps (see README.md).
#
# One [[app]] table per (framework, version); the app lives in tests/apps/<name>/.
# Adding a version = create that directory + add an entry here. CI builds its
# matrix from this file (`python3 tests/apps/apps.py matrix`), so nothing else
# needs editing.
#
# Fields (paths are relative to the app directory):
#   name              directory name and CI matrix leg, "<framework>-<version>"
#   framework         symfony | laravel | ...
#   version           the framework version the app is pinned to
#   docroot           web document root
#   front_controller  the script every request is routed to
#   console           the console entry point (`php <console> --version`)
#   install           how to install vendor/ (never runs composer scripts: some
#                     need a database or network services)
#   setup             commands run with php after install, in order
#   lint              paths scanned by `rhp-difftest lint`
#   known_refused     the lint ratchet list
#   known_requests    the request-diff ratchet (`rhp-difftest app`; corpus in
#                     requests.toml next to it)
#   smoke             "METHOD PATH STATUS" requests checked under php -S
#   router            false: php -S runs without a router script (it runs the
#                     .php file a path names, else index.php); default true,
#                     the front controller routes every request
#   php_extensions    extensions php must load beyond setup-php's list, in
#                     load order; CI installs them and its `-n` shims load
#                     them (the request diff runs php-cgi -n)
#   [[app.download]]  pinned files fetched by `apps.py setup` before install:
#                     `url`, `sha256` (checked), `to` (an archive is unpacked
#                     there without its top directory, anything else copied)

[[app]]
name = "symfony-7.4"
framework = "symfony"
version = "7.4"
docroot = "public"
front_controller = "public/index.php"
console = "bin/console"
install = "composer install --no-scripts --no-interaction"
setup = ["php bin/console cache:warmup"]
lint = ["vendor", "src", "config", "public"]
known_refused = "known-refused.txt"
known_requests = "known-passing-requests.txt"
smoke = [
    "GET / 200",
    "GET /hello/rhp 200",
    "GET /json?a=1 200",
    "GET /twig/rhp 200",
    "POST /submit 201",
    "GET /nope 404",
]

