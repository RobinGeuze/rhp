[package]
name = "phrust-vm"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
zendshim = ["phrust-builtins/zendshim"]

[dependencies]
phrust-values = { path = "../phrust-values" }
phrust-bytecode = { path = "../phrust-bytecode" }
phrust-semantics = { path = "../phrust-semantics" }
phrust-builtins = { path = "../phrust-builtins" }
indexmap = { workspace = true }
rustc-hash = { workspace = true }

[dev-dependencies]
phrust-compiler = { path = "../phrust-compiler" }
phrust-frontend = { path = "../phrust-frontend" }
